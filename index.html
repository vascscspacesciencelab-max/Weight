<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Scale</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #weight { font-size: 4em; font-weight: bold; }
        #status { color: gray; }
    </style>
</head>
<body>
    <h1>🌌 Cosmic Scale</h1>
    <div id="weight">--.-- kg</div>
    <div id="status">Updating...</div>

    <script>
        const USERNAME = "MR_LAB";
        const FEED_KEY = "earth-weight";
        const API_URL = `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${FEED_KEY}/data/last`;

        async function fetchData() {
            try {
                // Since the feed is public, we don't need a key.
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                document.getElementById('weight').textContent = parseFloat(data.value).toFixed(2) + ' kg';
                document.getElementById('status').textContent = 'Updated: ' + new Date(data.created_at).toLocaleTimeString();
            } catch (error) {
                document.getElementById('status').textContent = 'Error fetching data. Check console.';
                console.error("Fetch error:", error);
            }
        }

        // Fetch data immediately, then every 3 seconds
        fetchData();
        setInterval(fetchData, 3000);
    </script>
</body>
</html>
