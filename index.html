<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Scale</title>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #f5f0eb;
      color: #1a1a2e;
      text-align: center;
      margin-top: 80px;
    }
    h1 {
      background: linear-gradient(135deg, #f7971e, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
    }
    #weight {
      font-size: 5em;
      font-weight: 900;
      color: #4d9de0;
      margin: 20px 0;
    }
    #status {
      color: rgba(26,26,46,0.5);
      font-size: 0.8em;
      letter-spacing: 2px;
    }
    #error {
      color: #ff6b6b;
      font-size: 0.7em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>✦ COSMIC SCALE ✦</h1>
  <div id="weight">--.-- kg</div>
  <div id="status">Connecting...</div>
  <div id="error"></div>

  <script>
    const PROXY = "https://cosmic-proxy.your-name.workers.dev";  // ← your Worker URL
    const TARGET = "https://io.adafruit.com/api/v2/MR_LAB/feeds/earth-weight/data?limit=1";
    const API_URL = PROXY + "?url=" + encodeURIComponent(TARGET);

    async function fetchData() {
      const statusEl = document.getElementById("status");
      const errorEl  = document.getElementById("error");
      errorEl.textContent = "";

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        // data is an ARRAY: [{ value: "68.40", created_at: "..." }]
        const latest = data[0];

        document.getElementById("weight").textContent =
          parseFloat(latest.value).toFixed(2) + " kg";

        statusEl.textContent =
          "Updated: " + new Date(latest.created_at).toLocaleTimeString();
      } catch (err) {
        statusEl.textContent = "Error";
        errorEl.textContent = err.message;
        console.error(err);
      }
    }

    fetchData();
    setInterval(fetchData, 3000);
  </script>
</body>
</html>
